<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JamCrate Player</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="icons/favicon.png">
<link rel="stylesheet" href="app.css">

<header><span id="app-title">JamCrate Player</span></header>
<main id="screen"></main>
<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
